[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "client-data-migration-engine"
version = "0.1.0"
description = "Config-driven CSV/XLSX client data migration, validation and reconciliation engine."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<3.0",
    "openpyxl>=3.1,<4.0",
    "PyYAML>=6.0,<7.0",
    "pydantic>=2.8,<3.0",
    "SQLAlchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "typer>=0.12,<1.0",
    "rich>=13.7,<15.0",
    "python-dotenv>=1.0,<2.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "faker>=30,<40",
    "ruff>=0.6,<1.0"
]

[project.scripts]
migration-engine = "migration_engine.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
